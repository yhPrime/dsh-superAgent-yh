# dsh-superAgent-yh 自制版 bundle 层：
# 1) 插件行（配置留空走默认：dryRun=true、三个源全关）；
# 2) worker preset（执行器 Session 专用，精简工具集，不供手动选择）。
- insert:
    - id: dsh-superagent-yh
      name: dsh-superagent-yh
      config: {}
    - id: dsh-superagent-yh-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-yh-worker
        name: dsh-superAgent-yh 执行器
        description: dsh-superAgent-yh 的执行器 Session 专用，不供手动选择。前台命令超 5 秒转入后台，只含执行工单所需的工具。
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
              maxWaitTimeoutMs: 5000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 第三层：worker 可以再派子代理（orchestrator → worker → subagent）。
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
              # D48：把本组隔离 realm 里的 compaction 服务按 preset 登记给单会话维护器。
              - id: compaction-bridge
                name: dsh-superagent-yh/compaction-bridge
                config:
                  preset: dsh-superagent-yh-worker
    # 单会话「纯调度」preset（D30）：只留调度 persona、派活工具和压缩；
    # dispatcher 守卫把 profile 级全局工具（ops_bash/exp_recall 等）在本会话隐藏。
    - id: dsh-superagent-yh-dispatcher-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-yh-dispatcher
        name: dsh-superAgent-yh 调度者
        description: dsh-superAgent-yh 单会话专用：只负责接任务、派 worker、汇总回报，不自己动手。
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the dispatcher of this workspace's Superagent session. You never do the work yourself: you have no shell, file, search, or editing tools.
                When the user asks for real work, delegate it with the `delegate` tool. Write a complete, self-contained task prompt (absolute workspace path, what to do, how to verify). Use one delegate call per independent piece so they run in parallel.
                Permanent roles: when the same kind of work has already happened twice (or keeps demanding the same files and rules), pass a stable `role` name to `delegate` — the plugin keeps one long-lived session per role, reusing its memory. Look at the current role list first; reuse a name instead of inventing a twin. Never create a role just to park a task.
                Concurrency: at most 6 temporary workers run at once; extra calls are queued by the plugin, so keep calling `delegate` instead of retrying yourself.
                Never spawn a placeholder or "wait for it" subagent, and never poll: delegating ends your turn. Afterwards summarize each worker's report in two or three sentences: what changed, where, and what is still open. Answer small talk directly. Reply in the user's language.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
              # D48：dispatcher preset 也要按 preset 登记自己的 compaction 服务。
              - id: compaction-bridge
                name: dsh-superagent-yh/compaction-bridge
                config:
                  preset: dsh-superagent-yh-dispatcher
          # 派活工具 `delegate` 由插件全局注册；守卫必须放行它，只藏其余全局工具。
          - id: dispatcher-guard
            name: dsh-superagent-yh/dispatcher
            config:
              keep:
                - delegate
                - superagent_status
                - compress
                - decompress
                - search_context
                - acp_status
                - acp_cache
                - acp_read_original_image
