# dsh-superAgent-yh 自制版 bundle 层：
# 1) 插件行（配置留空走默认：dryRun=true、三个源全关）；
# 2) worker preset（执行器 Session 专用，精简工具集，不供手动选择）。
- insert:
    - id: dsh-superagent-yh
      name: dsh-superagent-yh
      config: {}
    - id: dsh-superagent-yh-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-yh-worker
        name: dsh-superAgent-yh 执行器
        description: dsh-superAgent-yh 的执行器 Session 专用，不供手动选择。前台命令超 5 秒转入后台，只含执行工单所需的工具。
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
              maxWaitTimeoutMs: 5000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 第三层：worker 可以再派子代理（orchestrator → worker → subagent）。
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    # 单会话「纯调度」preset（D30）：只留调度 persona、派活工具和压缩；
    # dispatcher 守卫把 profile 级全局工具（ops_bash/exp_recall 等）在本会话隐藏。
    - id: dsh-superagent-yh-dispatcher-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-superagent-yh-dispatcher
        name: dsh-superAgent-yh 调度者
        description: dsh-superAgent-yh 单会话专用：只负责接任务、派 worker、汇总回报，不自己动手。
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the dispatcher of this workspace's Superagent session. You never do the work yourself: you have no shell, file, search, or editing tools.
                When the user asks for real work, delegate it with the `subagent` tool. Write a complete, self-contained task prompt (workspace directory, what to do, how to verify), one worker per independent piece, and let workers run in parallel.
                Afterwards summarize each worker's report in two or three sentences: what changed, where, and what is still open. Answer small talk directly. Reply in the user's language.
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              agentPreset: dsh-superagent-yh-worker
              allowedAgentPresets:
                - dsh-superagent-yh-worker
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: dispatcher-guard
            name: dsh-superagent-yh/dispatcher
            config: {}
